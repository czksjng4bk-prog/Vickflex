<head>

<title>VickFlex Descanso</title>
<style>

*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,"Helvetica Neue",sans-serif;background:var(--b);color:var(--t);display:flex;height:100vh;overflow:hidden}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 30px;background:#faf7f1;border-bottom:1px solid var(--b2)}
#crumbs{font-size:15px;color:var(--g)} #crumbs a{color:var(--v);cursor:pointer;font-weight:600} #crumbs i{font-style:normal;margin:0 4px} #crumbs b{color:var(--t)}

.grid{display:grid;gap:16px}

/* Visitas telefónicas: teléfono verde junto al nombre */

.sev{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.sev.rojo{background:var(--ro)}.sev.amarillo{background:var(--am)}.sev.info{background:#bbb}
.cal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mon{background:#fff;border-radius:16px;padding:14px}.mon h3{margin-bottom:10px}

.wr.occ{border:1px solid transparent;color:var(--t)}.wr.e1{background:#fdf1d3}.wr.e2{background:var(--v2);border-color:var(--v)}.wr.e3{background:var(--v);color:#fff}

.leg2{font-size:13px;color:var(--g)}.lg{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px dashed #d9d0bd;margin:0 5px 0 12px;vertical-align:-2px}.lg.e1{background:#fdf1d3;border:0}.lg.e2{background:var(--v2);border:1px solid var(--v)}.lg.e3{background:var(--v);border:0}
.wk5{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bigb{width:100%;padding:16px 8px;font-size:16px;font-weight:700;border-radius:14px;background:var(--v);color:#fff;border:0;margin-bottom:10px;cursor:pointer;font-family:inherit}
.sec{font-size:20px;color:var(--v);margin:26px 0 12px}
.tb tr.tot td{font-weight:700;background:#faf7f1;border-top:2px solid var(--b2)}
.x{color:var(--ro);cursor:pointer;font-weight:700;padding:4px 6px}
.tag .x{padding:0 0 0 4px}
.addrow{display:flex;gap:8px;margin-top:10px}.addrow input{flex:1;padding:11px;border:1px solid var(--b2);border-radius:10px;font-size:16px;font-family:inherit}
.b2.sm{padding:6px 10px;font-size:13px}
.ym{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.filebtn{display:inline-block}
.tb{width:100%;border-collapse:collapse;font-size:15px}
.tb th{text-align:left;font-size:12px;color:var(--g);font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:2px solid var(--b2)}
.tb td{padding:13px 10px;border-bottom:1px solid #f0ebe0} .tb tr[onclick]{cursor:pointer} .tb tr[onclick]:active{background:#faf7f1}
.tb .r{text-align:right} .tb small{display:block;color:var(--g);font-size:12px}
.sel{padding:10px 12px;border:1px solid var(--b2);border-radius:10px;font-size:15px;background:#fff}
.semsel{display:flex;gap:10px;flex-wrap:wrap}
.semsel button{display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:12px;border:2px solid var(--b2);background:#fff;font-size:15px;cursor:pointer}
.semsel button.on{border-color:var(--t);font-weight:700}
.stat{text-align:center} .stat .big{font-size:32px} .stat small{color:var(--g);font-size:13px}
.big3{display:flex;gap:18px;justify-content:space-around}
.banner{background:#fff3d6;border:1px solid #ecd48d;border-radius:14px;padding:12px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.hint{color:var(--g);font-size:14px;line-height:1.5;margin-top:10px}

.rcard{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin:0 0 16px} .rcard .hot{background:#faf7f1;border:1px solid var(--b2)} .rcard a{color:var(--v);font-weight:600;text-decoration:none}
@media(max-width:820px){.rcard{grid-template-columns:1fr}}

.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px} .acts.l{justify-content:flex-start}

<body>
<nav>
  <img class="logo" src="logo.png" alt="VickFlex descanso">
  <button data-v="panel" onclick="go('panel')">Panel</button>
  <button data-v="reps" onclick="go('reps')">Representantes</button>
  <button data-v="copias" onclick="go('copias')">Copias de seguridad</button>
  <button data-v="coche" onclick="go('coche')">Coche expositor</button>
  <button data-v="alertas" onclick="go('alertas')">Alertas <span id="nbadge" class="badge"></span></button>
</nav>
<main>
  <div class="top"><div id="crumbs"></div>
    <div class="sb"><input id="q" type="search" placeholder="Buscar cliente…" oninput="buscar(this.value)" autocomplete="off"><div id="res"></div></div>
  </div>
  <div id="view"></div>
</main>
<div id="modal"></div><div id="toast"></div>
<script>
const KEY='vickflex_data',UNDO='vickflex_undo',YEAR=new Date().getFullYear();
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const eur=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' €';
const sg=n=>(n>0?'+':n<0?'−':'')+eur(Math.abs(n));
const fd=s=>{if(!s)return '';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

/* ---------- Datos: se guardan en este iPad (localStorage) ---------- */
/* La app empieza vacía: sin representantes, clientes, facturación ni visitas de ejemplo */
function emptyData(){return {schema:1,reps:[],clientes:[],equiv:[],imports:[],plan:[],semanas:[],festivos:[],lastBackup:null,changes:0}}
/* Nombre comercial y provincia de los clientes siempre en MAYÚSCULAS (con tildes y Ñ). No se toca ningún otro campo. */
const UPC=t=>String(t==null?'':t).toLocaleUpperCase('es-ES');
function mayusCli(c){if(!c)return;c.nombre=UPC(c.nombre);c.provincia=UPC(c.provincia);if(c.email)c.email=String(c.email).toLowerCase()}
/* Correos electrónicos de clientes y representantes siempre en minúsculas (solo cambian las letras) */
function minusRep(r){if(r&&r.email)r.email=String(r.email).toLowerCase()}
function migrate(d){
  d.schema=1;d.reps=d.reps||[];d.clientes=d.clientes||[];
  d.reps.forEach(r=>{['email','codigoFab','tel','ciudad','hotelN','hotelT'].forEach(k=>{if(r[k]==null)r[k]=''});if(!Array.isArray(r.provincias))r.provincias=[];minusRep(r)});
  d.clientes.forEach(c=>{c.fact=c.fact||{};c.exposicion=c.exposicion||[];c.pend=c.pend||[];c.visitas=c.visitas||[];c.pedidos=c.pedidos||[];c.obs=c.obs||'';c.visitas=c.visitas.map(v=>{v.id=v.id||uid();if(v.hablamos==null)v.hablamos=v.t||'';['pidio','compromisos','productos','prox','proxF','persona','expoNueva','expoPend','pedT','pedTxt','pedI','obs','repId','sem'].forEach(k=>{if(v[k]==null)v[k]=''});v.proxH=!!v.proxH;/* tipo de visita: las antiguas (sin tipo) son presenciales */if(v.tipo!=='telefonica')v.tipo='presencial';return v});c.codigo=c.codigo||'';c.email=c.email||'';c.cp=c.cp==null?'':String(c.cp);c.zona=c.zona==null?'':String(c.zona);c.acumul=c.acumul&&typeof c.acumul==='object'?c.acumul:{};c.comp=c.comp&&typeof c.comp==='object'?c.comp:{};c.catalogo=c.catalogo&&typeof c.catalogo==='object'?c.catalogo:{ok:null,f:''};c.prodPend=c.prodPend||[];c.expObs=c.expObs||'';mayusCli(c);c.nombreFact=c.nombreFact||'';c.semaforo=c.semaforo||'amarillo';
    if(!c.repHist||!c.repHist.length)c.repHist=[{r:c.repId,d:null}]});
  d.equiv=Array.isArray(d.equiv)?d.equiv:[];d.imports=Array.isArray(d.imports)?d.imports:[];d.plan=Array.isArray(d.plan)?d.plan:[];d.semanas=Array.isArray(d.semanas)?d.semanas:[];d.semanas.forEach(x=>{if(x.expoV===undefined)x.expoV=null;if(x.expoU===undefined)x.expoU=null});d.festivos=Array.isArray(d.festivos)?d.festivos:[];if(d.changes==null)d.changes=0; if(d.lastBackup===undefined)d.lastBackup=null; return d;
}
function load(){

/* Comparación de periodos equivalentes (ene–mm del año y frente a ene–mm del anterior).
   Si faltan datos en alguno de los dos periodos NO se calcula porcentaje: ok=false y why explica el motivo. */
function cmpL(cs,y,mm,k){k=k||VC;let a=0,p=0;cs.forEach(c=>{a+=acum(c,y,mm,k);p+=acum(c,y-1,mm,k)});

/* ======================= FACTURACIÓN TRIMESTRAL =======================
   Se calcula sola sumando los meses ya cargados (no se teclea nada). Un mes sin dato NO es 0 €.
   Trimestre en curso: solo se comparan los meses disponibles con los mismos meses del año anterior.
   Los acumulados importados sin desglose mensual no entran aquí (no se pueden repartir por trimestres). */
let QY=YEAR,QC='todas';
const QNAME=['1T','2T','3T','4T'],QMES=['ene, feb, mar','abr, may, jun','jul, ago, sep','oct, nov, dic'];
const monV=(cs,y,i,k)=>{let s=null;cs.forEach(c=>{const v=fy(c,y,k)[i];if(v!=null)s=(s||0)+v});return s};
const catAct=(cs,y,t)=>cs.some(c=>rawF(c,y,t).some(v=>v!=null));
function perCalc(cs,y,k,ms){
  const cats=k==='total'?CATS2:[k],cal=new Date().getMonth(),last=ms[ms.length-1],enCurso=y===YEAR&&last>=cal;
  let lastD=-1;cats.forEach(t=>{for(let i=11;i>=0;i--){if(monV(cs,y,i,t)!=null){if(i>lastD)lastD=i;break}}});
  const span=enCurso?ms.filter(i=>i<=lastD):ms;
  const miss=yy=>span.filter(i=>cats.some(t=>catAct(cs,yy,t)&&monV(cs,yy,i,t)==null));
  const sum=yy=>{let s=0,h=false;span.forEach(i=>cats.forEach(t=>{const v=monV(cs,yy,i,t);if(v!=null){s+=v;h=true}}));return {s:s,h:h}};
  const A=sum(y),B=sum(y-1),mc=miss(y),mp=miss(y-1);let ok=true,why='';
  const mn=l=>l.map(i=>MES[i]).join(', ');
  if(!span.length){ok=false;why='Sin datos de '+y}
  else if(!A.h){ok=false;why='Faltan datos de '+y}
  else if(!B.h){ok=false;why='Faltan datos de '+(y-1)}
  else{const bad=k==='total'?cats.find(t=>catAct(cs,y,t)!==catAct(cs,y-1,t)):null;
    if(bad){ok=false;why='Faltan datos de '+CATL[bad]+' en '+(catAct(cs,y,bad)?y-1:y)}
    else if(mc.length){ok=false;why='Faltan '+mn(mc)+' de '+y}
    else if(mp.length){ok=false;why='Faltan '+mn(mp)+' de '+(y-1)}}

  else if(enCurso)estado='En curso'+(span.length?' · '+(span.length>1?MES[span[0]]+'–'+MES[span[span.length-1]]:MES[span[0]]):' · sin datos aún');
  else if(!A.h)estado='Sin datos';
  else if(mc.length)estado='⚠ Datos incompletos: faltan '+mn(mc);

  return {s:A.s,p:B.s,d:A.s-B.s,ok:ok,why:why,ha:A.h,hp:B.h,enCurso:enCurso,mc:mc,mp:mp,estado:estado,pend:pend,span:span}}

/* ===================== INFORMES PDF Y ENVÍO POR CORREO =====================
   El PDF se crea aquí mismo, en el iPad: sin internet, sin servidores, sin subir nada a GitHub y sin enlaces públicos.
   Cada informe solo usa los clientes de ESE representante (o ese único cliente).

      if(y+h>788){d.page();head();th()}if(t)d.rect(M,y,W,h,PDFL);let x=M;C.forEach((c,i)=>{LS[i].forEach((l,k)=>d.text(c.al==='r'?x+c.w-6:x+6,y+(t?14.5:13)+k*11,l,{sz:9,b:t||c.b,al:c.al,col:t?PDFV:'#2b2b2b'}));x+=c.w});if(!t)d.line(M,y+h,M+W,y+h,'#ece5d8',.5);y+=h};

/* ---- Identificación del cliente: nombre comercial / nombre de facturación / código VICKFLEX ----
   El cliente se identifica internamente por su id (no cambia nunca). Renombrar el nombre comercial no pierde nada.
   D.equiv = equivalencias confirmadas a mano: [{n:'Nombre tal como viene en el Excel', c:'id del cliente'}] */
const equivOf=id=>(D.equiv||[]).filter(e=>e.c===id);
const nc=s=>norm(String(s||'').replace(/\s+/g,' ').trim());
const nz=s=>{s=nc(s);return /^\d+$/.test(s)?(s.replace(/^0+/,'')||'0'):s};
function chkDup(o,selfId){
  const cod=nz(o.codigo),nf=nc(o.nombreFact);
  for(const x of D.clientes){if(x.id===selfId)continue;
    if(cod&&nz(x.codigo)===cod)return 'Ese código VICKFLEX ya lo tiene el cliente «'+x.nombre+'».';
    if(nf&&nc(x.nombreFact)===nf)return 'Ese nombre de facturación ya lo tiene el cliente «'+x.nombre+'».';
    if(nf&&equivOf(x.id).some(e=>nc(e.n)===nf))return 'Ese nombre ya está guardado como equivalencia del cliente «'+x.nombre+'».'}
  return ''}
/* Para la importación (Fase D). Solo coincidencias exactas; ante cualquier duda devuelve null y se pregunta al usuario.
   1) código VICKFLEX  2) nombre de facturación o equivalencia guardada  3) null = asociación manual */
function matchCliente(codigo,nombre){
  const cod=nz(codigo),nm=nc(nombre);
  if(cod){const r=D.clientes.filter(x=>nz(x.codigo)===cod);if(r.length===1)return {cli:r[0],por:'código'};if(r.length>1)return null}
  if(nm){const r=D.clientes.filter(x=>nc(x.nombreFact)===nm||equivOf(x.id).some(e=>nc(e.n)===nm));
    const ids=[...new Set(r.map(x=>x.id))];if(ids.length===1)return {cli:r[0],por:'nombre de facturación'}}
  return null}

    const d=chkDup({codigo:'',nombreFact:o.n},cid);if(d)return d;
    D.equiv.push({n:o.n,c:cid});save();render(true)})}
function delEquiv(cid,i){

  ask(`¿Quitar la equivalencia <b>${esc(e.n)}</b>? Dejará de reconocerse automáticamente en las importaciones.`,'Quitar',()=>{D.equiv.splice(D.equiv.indexOf(e),1);save();render(true)})}

function factForm(id,y,k){

  <p class="hint">${k==='comp'?'Escribe <b>solo los complementos</b>. No repitas aquí importes que ya estén incluidos en la facturación principal: el total los suma.':'Escribe la <b>facturación principal</b> (colchones y productos principales, sin complementos).'} Deja en blanco un mes sin datos; escribe 0 si no hubo facturación.</p><p class="err" id="err"></p>
  <div class="acts"><button type="button" class="b2" onclick="closeModal()">Cancelar</button><button type="submit" class="b1">Guardar</button></div></form>`);

/* ===== Fase C: visitas, planificación semanal y alertas ===== */
const p2=n=>String(n).padStart(2,'0');
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const isoD=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const parseD=f=>new Date(f+'T12:00:00');
const addDays=(f,n)=>{const d=parseD(f);d.setDate(d.getDate()+n);return isoD(d)};
const mondayOf=f=>{const d=parseD(f),w=(d.getDay()+6)%7;return addDays(f,-w)};
const diasEntre=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const fcorta=f=>{const d=parseD(f);return p2(d.getDate())+'/'+p2(d.getMonth()+1)};
let PW=null,PR='',PP='',AF={rep:'',t:''};

/* --- Visitas: el historial nunca se borra; solo se añaden y, si hace falta, se corrigen --- */
/* Una visita es UN solo registro, guardado en la ficha del cliente (c.visitas). La semana del coche expositor
   solo apunta a ella con v.sem; nunca hay una segunda copia. */
const splitL=t=>String(t||'').split(',').map(x=>x.trim()).filter(Boolean);
const semOf=id=>(D.semanas||[]).find(x=>x.id===id);
const semLabel=x=>fcorta(x.ini)+'–'+fcorta(x.fin)+' · '+(x.prov||'sin provincia')+' · '+repNom(x.repId);
function visitaForm(cid,vid,planId,fecha,ctx){
  const c=cli(cid),v=vid?c.visitas.find(y=>y.id===vid):null;ctx=ctx||{};
  const f0=v?v.f:(fecha||hoy()),rep0=v?(v.repId||c.repId):(ctx.repId||c.repId);
  const sem0=v?v.sem:(ctx.sem||((D.semanas.find(x=>f0>=x.ini&&f0<=x.fin&&x.repId===rep0)||{}).id||''));
  const so=D.semanas.filter(x=>x.ini.slice(0,4)===f0.slice(0,4)||x.fin.slice(0,4)===f0.slice(0,4)||x.id===sem0).sort((a,b)=>a.ini.localeCompare(b.ini));
  const semOpts=[['','— Ninguna (visita normal) —']].concat(so.map(x=>[x.id,semLabel(x)]));
  const F=[{n:'tipo',l:'Tipo de visita',t:'radio',w:'w',o:[['presencial','Presencial'],['telefonica','Telefónica '+TELI]]},
    {n:'f',l:'Fecha',t:'date'},{n:'repId',l:'Representante',t:'select',o:D.reps.map(r=>[r.id,r.nombre])},
    {n:'persona',l:'Persona con la que he hablado'},{n:'sem',l:'Semana del coche expositor',t:'select',o:semOpts},
    {n:'hablamos',l:'Qué hemos hablado',t:'area',w:'w'},{n:'pidio',l:'Qué nos ha solicitado',t:'area',w:'w'},
    {n:'productos',l:'Colchones o productos comentados',t:'area',w:'w'},
    {n:'expoNueva',l:'Modelos que ha expuesto ahora (separados por comas)'},{n:'expoPend',l:'Posibles incorporaciones a la exposición (comas)'},
    {n:'pedT',l:'Resultado de la visita',t:'select',o:[['','Sin indicar'],['conseguido','Pedido conseguido'],['previsto','Previsto'],['ninguno','Ninguno']]},{n:'pedI',l:'Importe del pedido (€, opcional)'},
    {n:'pedTxt',l:'Qué pedido (modelos, unidades…)',w:'w'},
    {n:'compromisos',l:'Compromisos adquiridos',t:'area',w:'w'},{n:'prox',l:'Próxima acción pendiente',w:'w'},{n:'proxF',l:'Fecha prevista de esa acción (opcional)',t:'date'},
    {n:'obs',l:'Observaciones',t:'area',w:'w'}];
  const V=k=>v&&v[k]!=null?v[k]:'';
  const vals={tipo:v&&v.tipo==='telefonica'?'telefonica':'presencial',f:f0,repId:rep0,persona:V('persona'),sem:sem0,hablamos:V('hablamos'),pidio:V('pidio'),productos:V('productos'),expoNueva:V('expoNueva'),expoPend:V('expoPend'),pedT:V('pedT'),pedI:V('pedI')===''?'':String(V('pedI')).replace('.',','),pedTxt:V('pedTxt'),compromisos:V('compromisos'),prox:V('prox'),proxF:V('proxF'),obs:V('obs')};
  formModal(v?'Editar visita · '+c.nombre:'Nueva visita · '+c.nombre,F,vals,(o,which)=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(o.f))return 'Elige la fecha de la visita.';
    if(!o.hablamos&&!o.pidio&&!o.compromisos&&!o.productos&&!o.prox&&!o.persona&&!o.pedTxt&&!o.obs&&!o.expoNueva&&!o.expoPend)return 'Escribe al menos algo de la visita.';
    const wk=o.sem?semOf(o.sem):null;if(wk&&(o.f<wk.ini||o.f>wk.fin))return 'La fecha debe estar dentro de la semana elegida ('+fd(wk.ini)+' a '+fd(wk.fin)+').';
    let pi='';if(o.pedI!==''){pi=num(o.pedI);if(pi==null||isNaN(pi))return 'El importe del pedido no es válido.'}
    if((o.pedT===''||o.pedT==='ninguno')&&(o.pedI!==''||o.pedTxt))return 'Has escrito un pedido: en «Resultado de la visita» elige «Pedido conseguido» o «Previsto».';
    o.tipo=o.tipo==='telefonica'?'telefonica':'presencial';o.pedI=pi;let vv=v;
    if(v){snap('Editar visita '+fd(v.f)+' de '+c.nombre);Object.assign(v,o);
      const pe=c.pend.find(x=>x.v===v.id);if(pe&&o.compromisos){pe.t=o.compromisos}else if(!pe&&o.compromisos){c.pend.push({t:o.compromisos,h:false,v:v.id,f:o.f})}}
    else{vv=Object.assign({id:uid(),proxH:false,creado:Date.now()},o);c.visitas.push(vv);
      if(o.compromisos)c.pend.push({t:o.compromisos,h:false,v:vv.id,f:o.f});
      if(planId){const pl=D.plan.find(x=>x.id===planId);if(pl){pl.hecha=true;pl.visitId=vv.id}}}
    /* los modelos nuevos pasan a la exposición del cliente y las posibles incorporaciones a sus pendientes (solo se añaden, nunca se quitan) */
    splitL(o.expoNueva).forEach(t=>{if(!c.exposicion.some(x=>norm(x)===norm(t)))c.exposicion.push(t);c.prodPend=c.prodPend.filter(x=>norm(x)!==norm(t))});
    splitL(o.expoPend).forEach(t=>{if(!c.exposicion.some(x=>norm(x)===norm(t))&&!c.prodPend.some(x=>norm(x)===norm(t)))c.prodPend.push(t)});
    save();toast('Visita guardada.');
    if(which==='otra'&&wk){render(true);pickCliente(wk.id,o.f);return true}
    render(true)},
    {intro:'Exposición actual de este cliente: <b>'+(c.exposicion.length?esc(c.exposicion.join(', ')):'sin datos')+'</b>'+(c.prodPend.length?' · Pendientes: <b>'+esc(c.prodPend.join(', '))+'</b>':''),extra:(!v&&ctx.sem)?[{k:'otra',l:'Guardar y añadir otra visita'}]:[]})}

    ${v.expoNueva?`<dt>Nuevos modelos expuestos</dt><dd>${esc(v.expoNueva)}</dd>`:''}${v.expoPend?`<dt>Posibles incorporaciones</dt><dd>${esc(v.expoPend)}</dd>`:''}

const visBtns=(c,v)=>`<button class="b2 sm" onclick="verVisita('${c.id}','${v.id}')">Ver visita</button><button class="b2 sm" onclick="visitaForm('${c.id}','${v.id}')">Editar visita</button><button class="b2 sm dng" onclick="delVisita('${c.id}','${v.id}')">Eliminar visita</button>`;
function abrirVisitas(cid){go('cli/'+cid);setTimeout(()=>{const e=document.getElementById('visitas');if(e)e.scrollIntoView({block:'start'})},150)}
function verVisita(cid,vid){const c=cli(cid),v=c&&c.visitas.find(x=>x.id===vid);if(!v)return;const wk=v.sem?semOf(v.sem):null;
  modal(`<h2>Visita · ${esc(c.nombre)}</h2><p class="sub" style="margin-bottom:12px">${fd(v.f)}${wk?' · 🚐 Coche expositor · '+esc(semLabel(wk)):''}</p><div class="vis">${visDL(c,v)}</div>

/* Eliminar una visita: solo se borra ese registro (y el compromiso que nació de ella). No se borra el cliente, el representante, la semana del coche, la exposición ni la facturación. */
function delVisita(cid,vid){const c=cli(cid),v=c&&c.visitas.find(x=>x.id===vid);if(!v)return;
  const comp=c.pend.filter(p=>p.v===v.id),wk=v.sem?semOf(v.sem):null,dep=[];
  if(v.pedT==='conseguido'||v.pedT==='previsto')dep.push('un <b>pedido '+esc(v.pedT)+'</b>'+(v.pedI!==''&&v.pedI!=null?' de '+eur(v.pedI):'')+(v.pedTxt?' ('+esc(v.pedTxt)+')':''));
  comp.forEach(p=>dep.push('el compromiso <b>«'+esc(p.t)+'»</b>'+(p.h?' (ya hecho)':' (pendiente)')+', que se quitará también de «Compromisos pendientes»'));
  if(v.prox)dep.push('la próxima acción <b>«'+esc(v.prox)+'»</b>'+(v.proxH?' (ya hecha)':' (pendiente)'));
  if(wk)dep.push('está en la semana del coche expositor <b>'+esc(semLabel(wk))+'</b>: desaparecerá de esa semana, pero la semana y sus ventas se conservan');
  if(v.expoNueva||v.expoPend)dep.push('modelos de exposición anotados; la <b>exposición actual del cliente no se modifica</b>');
  ask(`<b>¿Estás seguro de que quieres eliminar esta visita? Esta acción no se podrá deshacer.</b><br><br>Visita del <b>${fd(v.f)}</b> a <b>${esc(c.nombre)}</b>.${dep.length?'<br><br>⚠ Esta visita tiene información relacionada:<ul style="margin:6px 0 0 18px;line-height:1.5">'+dep.map(x=>'<li>'+x+'</li>').join('')+'</ul>':''}<br>No se borra el cliente, el representante, la semana del coche ni la facturación.`,'Eliminar visita',()=>{
    snap('Eliminar visita '+fd(v.f)+' de '+c.nombre);
    c.visitas=c.visitas.filter(x=>x.id!==vid);c.pend=c.pend.filter(p=>p.v!==vid);
    (D.plan||[]).forEach(x=>{if(x.visitId===vid){x.visitId='';x.hecha=false}});
    save();render(true);toast('Visita eliminada.')})}

/* --- Planificación semanal --- */
function planForm(id,pre){
  const pl=id?D.plan.find(x=>x.id===id):null;pre=pre||{};
  const c0=pl?cli(pl.cliId):(pre.cliId?cli(pre.cliId):null),r0=c0?c0.repId:(PR||(D.reps[0]&&D.reps[0].id)||'');
  modal(`<h2>${pl?'Editar visita planificada':'Planificar visita'}</h2><form id="frm"><div class="fg">
   <label class="f"><span>Representante</span><select name="rep" onchange="planRefill()">${D.reps.map(r=>`<option value="${r.id}" ${r.id===r0?'selected':''}>${esc(r.nombre)}</option>`).join('')}</select></label>
   <label class="f"><span>Provincia</span><select name="prov" onchange="planRefill()"></select></label>
   <label class="f w"><span>Cliente</span><select name="cli"></select></label>
   <label class="f"><span>Fecha</span><input type="date" name="f" value="${esc(pl?pl.f:(pre.f||hoy()))}"></label>
   <label class="f"><span>Hora (opcional)</span><input type="time" name="h" value="${esc(pl?pl.h:'')}"></label>
   <label class="f w"><span>Nota (qué quiero tratar)</span><textarea name="n" rows="3">${esc(pl?pl.n:'')}</textarea></label></div>
   <p class="err" id="err"></p><div class="acts"><button type="button" class="b2" onclick="closeModal()">Cancelar</button><button type="submit" class="b1">Guardar</button></div></form>`);
  const fm=$('#frm');fm.dataset.c=c0?c0.id:'';fm.dataset.p=c0?(c0.provincia||''):'';planRefill(true);
  fm.onsubmit=e=>{e.preventDefault();const o={cliId:fm.elements.cli.value,f:fm.elements.f.value,h:fm.elements.h.value,n:fm.elements.n.value.trim()};
    if(!o.cliId)return void($('#err').textContent='Elige un cliente (el representante debe tener clientes).');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(o.f))return void($('#err').textContent='Elige la fecha.');
    if(pl)Object.assign(pl,o);else D.plan.push(Object.assign({id:uid(),hecha:false},o));
    save();closeModal();PW=mondayOf(o.f);render(true);toast('Visita planificada.')}}
function planRefill(first){
  const fm=$('#frm'),rid=fm.elements.rep.value,cs=clientsOf(rid);
  const provs=[...new Set(cs.map(c=>c.provincia||'Sin provincia'))].sort();
  const sel=first&&fm.dataset.p?fm.dataset.p:fm.elements.prov.value;
  fm.elements.prov.innerHTML='<option value="">Todas</option>'+provs.map(q=>`<option ${q===sel?'selected':''}>${esc(q)}</option>`).join('');
  const pv=fm.elements.prov.value,l=cs.filter(c=>!pv||(c.provincia||'Sin provincia')===pv).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  const keep=first?fm.dataset.c:fm.elements.cli.value;
  fm.elements.cli.innerHTML=l.map(c=>`<option value="${c.id}" ${c.id===keep?'selected':''}>${esc(c.nombre)} · ${esc(c.poblacion)}</option>`).join('')}
function delPlan(id){const pl=D.plan.find(x=>x.id===id),c=cli(pl.cliId);ask(`¿Quitar de la planificación la visita a <b>${esc(c?c.nombre:'')}</b> del ${fd(pl.f)}? (No se borra ninguna visita registrada.)`,'Quitar',()=>{snap('Quitar visita planificada');D.plan=D.plan.filter(x=>x.id!==id);save();render(true)})}
function regPlan(id){const pl=D.plan.find(x=>x.id===id);visitaForm(pl.cliId,null,id,pl.f)}
function planSem(d){PW=addDays(PW||mondayOf(hoy()),d*7);render(true)}
function planHoy(){PW=mondayOf(hoy());render(true)}

  const sug=cand.filter(c=>okc(c)&&!plannedIds.has(c.id)).map(c=>{const v=lastVisita(c);return {c:c,d:v?diasEntre(v.f,t):9999}}).filter(x=>x.d>=90).sort((a,b)=>b.d-a.d).slice(0,8);
  return `<div class="bar2"><div class="seg"><button class="on">Visitas planificadas</button><button onclick="go('coche')">🚐 Coche expositor</button></div></div><div class="hb"><div><h1>Planificación semanal</h1><p class="sub" style="margin-bottom:0">Semana del lunes ${fd(days[0])} al viernes ${fd(days[4])}</p></div>

  <div class="bar2"><label>Representante <select class="sel" onchange="setPR(this.value)"><option value="">Todos</option>${D.reps.map(r=>`<option value="${r.id}" ${r.id===PR?'selected':''}>${esc(r.nombre)}</option>`).join('')}</select></label>
   <label>Provincia <select class="sel" onchange="setPP(this.value)"><option value="">Todas</option>${provs.map(q=>`<option ${q===PP?'selected':''}>${esc(q)}</option>`).join('')}</select></label>
   <span class="mut">${inW.length} visitas planificadas · ${inW.filter(x=>x.hecha).length} hechas</span></div>
  ${fst?`<div class="festb"><span>🏖 <b>Semana festiva</b>${fst.obs?' · '+esc(fst.obs):''}</span><button class="b2 sm" onclick="weekMenu('${PW}')">Cambiar</button></div>`:''}

const ATIPO={plan:'Visita planificada sin registrar',prox:'Próxima acción pendiente',comp:'Compromiso pendiente',sinanio:'Compró el año pasado y aún no este año',sinm:'Varios meses sin comprar',caida:'Facturación inferior al año anterior',norep:'Sin repetir compra este año',cat:'Catálogo sin actualizar',expo:'Producto pendiente de exponer',visita:'Sin visita reciente'};
function alertas(){
  const m=corte(),t=hoy(),L=[],add=(c,k,sev,txt)=>L.push({c:c,k:k,sev:sev,txt:txt});
  D.clientes.forEach(c=>{
    c.visitas.filter(v=>v.prox&&!v.proxH).forEach(v=>{const late=v.proxF&&v.proxF<t;add(c,'prox',late?'rojo':'amarillo',v.prox+(v.proxF?' ('+(late?'vencida el ':'para el ')+fd(v.proxF)+')':''))});
    c.pend.filter(x=>!x.h).forEach(x=>add(c,'comp','amarillo',x.t));
    const prior=has(c,YEAR-1,12,'total')&&acum(c,YEAR-1,12,'total')>0;
    if(prior&&(!has(c,YEAR,m,'total')||acum(c,YEAR,m,'total')===0))add(c,'sinanio','rojo','Facturó '+eur(acum(c,YEAR-1,12,'total'))+' en '+(YEAR-1)+' y todavía nada en '+YEAR);
    else if(sinComprar(c,m))add(c,'sinm','rojo','Lleva '+mesesSin(c,m)+' meses sin facturar');
    const o=cmpL([c],YEAR,m,'total');if(o.ok&&o.d<0&&o.p>0){const pc=o.d/o.p*100;add(c,'caida',pc<=-20?'rojo':'amarillo',sg(o.d)+' ('+pc.toFixed(1).replace('.',',')+' %) frente al mismo periodo de '+(YEAR-1))}
    if(nCompras(c)===1)add(c,'norep','amarillo','Solo una compra en '+YEAR);
    if(c.catalogo.ok===false)add(c,'cat','amarillo','Catálogo marcado como NO actualizado');
    c.prodPend.forEach(x=>add(c,'expo','amarillo',x));
    const v=lastVisita(c),d=v?diasEntre(v.f,t):null;if(d==null)add(c,'visita','info','Sin visitas registradas');else if(d>=90)add(c,'visita','info','Última visita hace '+d+' días')});
  const ord={rojo:0,amarillo:1,info:2};return L.sort((a,b)=>ord[a.sev]-ord[b.sev]||a.c.nombre.localeCompare(b.c.nombre,'es'))}
function vAlertas(){
  const all=alertas(),L=all.filter(a=>(!AF.rep||a.c.repId===AF.rep)&&(!AF.t||a.k===AF.t)),cnt={};all.filter(a=>!AF.rep||a.c.repId===AF.rep).forEach(a=>cnt[a.k]=(cnt[a.k]||0)+1);
  return `<h1>Alertas</h1><p class="sub">Se calculan solas con los datos de tus clientes. ${all.filter(a=>a.sev==='rojo').length} urgentes · ${all.filter(a=>a.sev==='amarillo').length} a vigilar · ${all.filter(a=>a.sev==='info').length} informativas.</p>

async function unzipX(buf){

    files[name]={meth,cs,lo};p+=46+nl+el+cl}
  const get=async nm=>{const f=files[nm];if(!f)return null;
    const ln=dv.getUint16(f.lo+26,true),le=dv.getUint16(f.lo+28,true),st=f.lo+30+ln+le,data=u8.subarray(st,st+f.cs);
    if(f.meth===0)return new TextDecoder().decode(data);
    if(typeof DecompressionStream==='undefined')throw new Error('nodecomp');
    const ab=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    return new TextDecoder().decode(ab)};
  return {names:Object.keys(files),get}}

/* ---- CSV / texto ---- */
function parseCSV(t){

  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===dl){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=ch}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''))}
function parseTextoLibre(t){
  const ls=t.split(/\r?\n/).filter(l=>l.trim());
  const tabs=ls.filter(l=>l.indexOf('\t')>=0).length;
  if(ls.length&&tabs>=ls.length*0.5)return ls.map(l=>l.split('\t'));
  const semis=ls.filter(l=>(l.match(/;/g)||[]).length>=3).length;
  if(ls.length&&semis>=ls.length*0.5)return parseCSV(t);
  return ls.map(l=>[l])}   // una sola celda por línea -> se analiza como informe impreso

const tx=v=>v==null?'':String(v).replace(/\s+/g,' ').trim();

function parseLineaImpresa(s){

  const last=tk[tk.length-1];

  const mid=tk.slice(1,imp==null?tk.length:tk.length-1).join(' ').replace(/\s*[—–-]+\s*$/,'');

function splitMid(cod,mid,imp){

  else{const cp=/\b\d{5}\b/.exec(mid);if(cp){nombre=mid.slice(0,cp.index).trim();rest=mid.slice(cp.index).trim()}}

    if(r.filter(Boolean).length<3)continue;
    const mc=r.findIndex(x=>/^c[oó]d/i.test(x)),mi=r.findIndex(x=>/ventas|importe|facturaci|total/i.test(x));
    if(mc>=0&&mi>=0&&mc!==mi){hi=i;map={cod:mc,imp:mi,nom:r.findIndex(x=>/raz[oó]n|nombre|cliente/i.test(x)),em:r.findIndex(x=>/correo|e-?mail/i.test(x)),pob:r.findIndex(x=>/poblaci|localidad/i.test(x))};break}}
  rows.forEach((raw,i)=>{

    // metadatos

      if(!o.nombre&&!o.cod)return;out.push(o);return}
    if(cells.length===1||cells.filter(Boolean).length===1){const o=parseLineaImpresa(line);if(o)out.push(o);else if(/\d/.test(line)&&line.length>25&&!/p[aá]g|fecha|vendedor|c[oó]digo|clientes por/i.test(line))ign++;return}
    // tabla sin cabecera detectada: intentamos como línea impresa

/* ---- periodo ---- */
function detPeriodo(ini,fin){
  if(!ini||!fin)return {modo:null,msg:'El informe no trae fechas claras: elige tú el periodo.'};
  const a=ini.split('-').map(Number),b=fin.split('-').map(Number);
  const ult=new Date(b[0],b[1],0).getDate();
  if(a[0]!==b[0]||b[2]!==ult)return {modo:'bad',msg:'Periodo '+fd(ini)+' – '+fd(fin)+': no termina en fin de mes o cruza de año.'};
  if(a[1]===b[1]&&a[2]===1)return {modo:'mes',y:b[0],m:b[1]};
  if(a[1]===1&&a[2]===1)return {modo:'acum',y:b[0],m:b[1]};
  return {modo:'bad',msg:'Periodo '+fd(ini)+' – '+fd(fin)+': solo se admiten un mes completo o un acumulado desde el 1 de enero.'}}

/* ======================= IMPORTAR CLIENTES (FICHAS) DESDE EXCEL O CSV =======================
   Crea o completa fichas de clientes de UN representante a partir de un Excel (.xlsx) o CSV, siempre con vista previa y confirmación.

let CL=null;

const CLNOM={codigo:'código',nombreFact:'razón social',direccion:'dirección',cp:'CP',poblacion:'población',provincia:'provincia',telefono:'teléfono',contacto:'contacto',email:'correo'};
/* qué cambiaría en un cliente existente: «fill» solo rellena huecos; «upd» pone los datos del Excel. Nunca cambia el nombre comercial ni un código ya puesto. */
function clCambios(o,c,modo){const L=[];CLCAMPOS.forEach(k=>{const nv=o[k],ov=String(c[k]||'');if(!nv||nc(nv)===nc(ov))return;if(k==='codigo'&&ov)return;if(modo==='fill'&&ov)return;L.push(k)});return L}
function clOpts(o){const r=rep(CL.rep),O=[];
  if(o.bloq)return [['skip','No importar']];
  const upd=(c,lab)=>{const otro=c.repId!==CL.rep;O.push(['fill|'+c.id+'|0','Completar datos vacíos de «'+c.nombre+'»'+(otro?' (sigue con '+repNom(c.repId)+')':'')]);O.push(['upd|'+c.id+'|0','Actualizar «'+c.nombre+'» con los datos del Excel'+(otro?' (sigue con '+repNom(c.repId)+')':'')]);
    if(otro){O.push(['fill|'+c.id+'|1','Completar datos vacíos y pasar a '+r.nombre]);O.push(['upd|'+c.id+'|1','Actualizar con el Excel y pasar a '+r.nombre])}};
  if(o.ex){O.push(['skip','Omitir (no tocarlo)']);upd(o.ex.c)}
  else{O.push(['new','Importar como nuevo']);O.push(['skip','No importar']);o.cand.forEach(x=>upd(x.c))}
  return O}
function clSetAct(i,v){CL.items[i].act=v;keepScroll(clRender)}
function clFiltro(f){CL.filtro=f;keepScroll(clRender)}
function clResumen(){const I=CL.items,n=k=>I.filter(o=>o.est===k).length;
  return {nuevo:n('nuevo'),existe:n('existe'),posible:n('posible'),revisar:n('revisar'),crear:I.filter(o=>o.act==='new').length,act:I.filter(o=>/^(fill|upd)/.test(o.act)).length,omit:I.filter(o=>o.act==='skip').length}}
function clRender(){const r=rep(CL.rep),H=CL.hojas[CL.hoja],hdr=(H.rows[CL.fila]||[]),S=clResumen(),I=CL.items;
  const colOpt=k=>`<option value="">— no usar —</option>`+hdr.map((t,ci)=>`<option value="${ci}" ${CL.map[k]===ci?'selected':''}>${esc(t||('Columna '+(ci+1)))}</option>`).join('');
  const sinNom=CL.map.nombre==null,sinCod=CL.map.codigo==null;
  const vis=I.map((o,i)=>[o,i]).filter(([o])=>CL.filtro==='todos'||o.est===CL.filtro);
  const filas=vis.map(([o,i])=>{const E=CLE[o.est],ch=o.act.split('|'),c=ch[1]?cli(ch[1]):null,cmb=c?clCambios(o,c,ch[0]):[];
    return `<tr${o.est!=='nuevo'?' style="background:'+(o.est==='revisar'?'#fff6ea':o.est==='existe'?'#f4f1ea':'#fffaf0')+'"':''}><td class="mut">${o.fila}</td><td style="min-width:190px"><span class="pill ${E[1]}">${E[0]}</span><div style="margin-top:6px"><select style="padding:8px;border:1px solid var(--b2);border-radius:8px;font-size:14px;width:200px" ${o.bloq?'disabled':''} onchange="clSetAct(${i},this.value)">${clOpts(o).map(x=>`<option value="${esc(x[0])}" ${x[0]===o.act?'selected':''}>${esc(x[1])}</option>`).join('')}</select></div></td>
     <td>${o.codigo?'<b>'+esc(o.codigo)+'</b>':'<span class="mut">pendiente</span>'}</td>
     <td style="min-width:180px"><b>${esc(o.nombre||'—')}</b>${o.prov?'<small>Nombre comercial provisional (= razón social)</small>':`<small>Razón social: ${esc(o.nombreFact)}</small>`}</td>
     <td style="min-width:150px">${esc(o.direccion||'—')}<small>${esc([o.cp,o.poblacion].filter(Boolean).join(' '))}${o.provincia?' ('+esc(o.provincia)+')':''}</small></td>
     <td style="min-width:150px;word-break:break-word">${esc(o.telefono||'—')}${o.contacto?'<small>Contacto: '+esc(o.contacto)+(o.telNota?' (venía junto al teléfono)':'')+'</small>':''}<small>${esc(o.email||'sin correo')}</small></td>
     <td style="min-width:180px;font-size:13px;line-height:1.35">${o.ex?`<div>Coincide por <b>${esc(o.ex.por)}</b> con <a style="color:var(--v);font-weight:600" onclick="closeModal();go('cli/${o.ex.c.id}')">${esc(o.ex.c.nombre)}</a> (${esc(repNom(o.ex.c.repId))})</div>`:''}
       ${o.cand.map(x=>`<div>Parecido a <b>${esc(x.c.nombre)}</b> (${esc(repNom(x.c.repId))}) · ${esc(x.por)}</div>`).join('')}
       ${o.av.map(a=>`<div class="dn">⚠ ${esc(a)}</div>`).join('')}${o.inf.map(a=>`<div class="mut">ℹ ${esc(a)}</div>`).join('')}
       ${c?`<div style="color:var(--v)">${cmb.length?'Cambiará: '+cmb.map(k=>CLNOM[k]).join(', '):'No hay datos nuevos que añadir'}${ch[2]==='1'?' · pasa a '+esc(r.nombre):''}</div>`:''}</td></tr>`}).join('');
  const kb=(k,l,n)=>`<button class="${CL.filtro===k?'on':''}" onclick="clFiltro('${k}')">${l} · ${n}</button>`;
  modalW(`<h2>Vista previa · importar clientes · ${esc(r.nombre)}</h2>
  <p class="hint" style="margin:0 0 10px"><b>Todavía no se ha guardado nada.</b> Archivo: <b>${esc(CL.archivo)}</b>${CL.hojas.length>1?' · hoja <b>'+esc(H.nombre)+'</b>':''} · ${I.length} clientes leídos · todos se asignan a <b>${esc(r.nombre)}</b>.</p>
  ${CL.fileRep?(()=>{const F=CL.fileRep,ok=(r.codigoFab&&nz(F.cod)===nz(r.codigoFab))||(!r.codigoFab&&mismoNombre(F.nom,r.nombre));return `<div class="card" style="margin-bottom:12px;background:${ok?'var(--v2)':'#fbe6e2'}"><b>${ok?'✔':'⚠'} Este listado es del vendedor ${esc(F.cod)} · ${esc(F.nom)}</b>${ok?'':` · Estás en la ficha de <b>${esc(r.nombre)}</b>${r.codigoFab?' ('+esc(r.codigoFab)+')':''}. Si es correcto, pon el código ${esc(F.cod)} en «Editar» del representante; si no, entra en la ficha del representante correcto.`}</div>`})():''}
  <div class="grid k" style="margin-bottom:12px">
   <div class="card"><h3>Clientes nuevos</h3><div class="big" style="font-size:28px">${S.nuevo}</div><div class="mut" style="font-size:13px">sin coincidencias</div></div>
   <div class="card"><h3>Ya existentes</h3><div class="big" style="font-size:28px">${S.existe}</div><div class="mut" style="font-size:13px">mismo código o razón social</div></div>
   <div class="card"><h3>Posibles duplicados</h3><div class="big" style="font-size:28px">${S.posible}</div><div class="mut" style="font-size:13px">nombre, correo o teléfono parecidos</div></div>
   <div class="card"><h3>Necesitan revisión</h3><div class="big" style="font-size:28px">${S.revisar}</div><div class="mut" style="font-size:13px">avisos en la fila</div></div></div>
  <details class="card" style="margin-bottom:12px" ${sinNom&&CL.map.nombreFact==null?'open':''}><summary style="cursor:pointer;font-weight:600;color:var(--v)">Columnas del Excel (pulsa para comprobarlas o cambiarlas)</summary>
   ${CL.hojas.length>1?`<label class="f" style="margin-top:10px"><span>Hoja</span><select onchange="clSetHoja(this.value)">${CL.hojas.map((h,i)=>`<option value="${i}" ${i===CL.hoja?'selected':''}>${esc(h.nombre)} (${h.rows.length} filas)</option>`).join('')}</select></label>`:''}
   <div class="fg">${CLF.map(f=>`<label class="f"><span>${f[1]}</span><select onchange="clSetMap('${f[0]}',this.value)">${colOpt(f[0])}</select></label>`).join('')}</div>
   <p class="hint" style="margin:0">${sinNom?'No hay columna de nombre comercial: se usará la razón social como nombre comercial provisional. ':''}${sinCod?'No hay columna de código: los clientes se crean sin código. ':''}Los códigos se guardan como texto, con sus ceros iniciales.</p></details>
  <div class="bar2"><div class="seg">${kb('todos','Todos',I.length)}${kb('nuevo','Nuevos',S.nuevo)}${kb('existe','Existentes',S.existe)}${kb('posible','Posibles duplicados',S.posible)}${kb('revisar','Revisar',S.revisar)}</div></div>
  <div class="card"><div style="overflow:auto;max-height:50vh;-webkit-overflow-scrolling:touch"><table class="tb" style="font-size:14px"><thead><tr><th>Fila</th><th>Estado · qué hacer</th><th>Código</th><th>Cliente</th><th>Dirección</th><th>Teléfono / correo</th><th>Comprobación</th></tr></thead><tbody>${filas||'<tr><td colspan="7" class="mut">Ninguno en este grupo.</td></tr>'}</tbody></table></div></div>
  <p class="hint">Se van a <b>crear ${S.crear}</b> clientes nuevos, <b>actualizar ${S.act}</b> existentes y <b>omitir ${S.omit}</b>. «Completar datos vacíos» solo rellena lo que falta; «Actualizar» pone los datos del Excel. En ningún caso se cambia el nombre comercial ni un código ya puesto, ni se borran visitas, facturación, exposiciones o seguimientos.</p>
  <div class="acts"><button class="b2" onclick="clF1()">← Elegir otro archivo</button><button class="b2" onclick="CL=null;closeModal()">Cancelar</button><button class="b1" ${S.crear+S.act?'':'disabled style="opacity:.45"'} onclick="clConfirmar()">Importar…</button></div>`)}
function clConfirmar(){const S=clResumen(),r=rep(CL.rep);
  ask(`Vas a importar en <b>${esc(r.nombre)}</b>:<ul style="margin:8px 0 0 18px;line-height:1.6"><li><b>${S.crear}</b> clientes nuevos</li><li><b>${S.act}</b> clientes existentes actualizados</li><li><b>${S.omit}</b> filas omitidas</li></ul><br>Antes se guarda una copia interna para poder deshacerlo (Copias de seguridad › Deshacer).`,'Importar ahora',clAplicar)}
function clAplicar(){const r=rep(CL.rep);snap('Importar clientes de '+r.nombre+' ('+CL.archivo+')');let nu=0,ac=0,om=0;const res=[];
  CL.items.forEach(o=>{const a=o.act.split('|');
    if(a[0]==='new'){/* última comprobación para no duplicar nunca */
      const cod=nz(o.codigo),k=nc(o.nombreFact);
      if((cod&&D.clientes.some(c=>nz(c.codigo)===cod))||(k&&D.clientes.some(c=>nc(c.nombreFact)===k))){om++;res.push(o.nombre+': ya existía, no se ha creado');return}
      D.clientes.push({id:uid(),codigo:o.codigo,nombreFact:o.nombreFact,nombre:o.nombre,poblacion:o.poblacion,cp:o.cp,zona:'',provincia:o.provincia,direccion:o.direccion,telefono:o.telefono,contacto:o.contacto,email:o.email,
        acumul:{},repId:CL.rep,semaforo:'amarillo',obs:'',fact:{},comp:{},catalogo:{ok:null,f:''},prodPend:[],expObs:'',exposicion:[],pend:[],visitas:[],pedidos:[],repHist:[{r:CL.rep,d:Date.now()}]});nu++}
    else if(a[0]==='fill'||a[0]==='upd'){const c=cli(a[1]);if(!c){om++;return}
      clCambios(o,c,a[0]).forEach(k=>{if(k==='nombreFact'&&c.nombreFact&&!equivOf(c.id).some(e=>nc(e.n)===nc(c.nombreFact)))D.equiv.push({n:c.nombreFact,c:c.id});c[k]=o[k]});
      if(a[2]==='1'&&c.repId!==CL.rep){c.repId=CL.rep;c.repHist.push({r:CL.rep,d:Date.now()})}ac++}
    else om++});
  D.imports.push({id:uid(),at:Date.now(),rep:CL.rep,tipo:'principal',modo:'clientes',y:YEAR,m:0,hash:'c'+Date.now(),archivo:CL.archivo,n:nu+ac,total:0,nuevos:nu});
  if(!save())return;const id=CL.rep;CL=null;go('rep/'+id);render(true);
  modal(`<h2>✔ Importación terminada</h2><p class="msg" style="line-height:1.7"><b>${nu}</b> clientes nuevos creados<br><b>${ac}</b> clientes existentes actualizados<br><b>${om}</b> filas omitidas${res.length?'<br><br>'+res.map(esc).join('<br>'):''}</p><p class="hint">Ya los tienes en la lista de ${esc(r.nombre)}. Si algo no está bien: Copias de seguridad › Deshacer. Recuerda hacer una copia de seguridad nueva.</p><div class="acts"><button class="b2" onclick="closeModal();go('copias')">Ir a Copias de seguridad</button><button class="b1" onclick="closeModal()">Ver clientes</button></div>`)}

render();
</script>
</body>
